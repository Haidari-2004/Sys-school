{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">{{ title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">نام صنف</label>
                            {{ form.class_name }}
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">درجه / پایه تحصیلی</label>
                            {{ form.grade_level }}
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'class_list' %}" class="btn btn-light">انصراف</a>
                            <button type="submit" class="btn btn-primary px-4">ذخیره اطلاعات</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
