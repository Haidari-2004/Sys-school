{% extends 'core/base.html' %}

{% block title %}تأیید حذف استاد{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-1"></i>
                </div>
                <h4 class="fw-bold mb-2">آیا از حذف این استاد اطمینان دارید؟</h4>
                <p class="text-muted mb-4">
                    استاد <strong>{{ teacher.first_name }} {{ teacher.last_name }}</strong> به طور کامل از سیستم پاک خواهد شد.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'teacher_list' %}" class="btn btn-light px-4">انصراف</a>
                        <button type="submit" class="btn btn-danger px-4">بله، حذف شود</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
