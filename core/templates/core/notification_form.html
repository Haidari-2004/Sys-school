{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white p-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-send-fill me-2"></i>{{ title }}</h5>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">عنوان اعلان</label>
                    {{ form.title }}
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">نوع اعلان</label>
                        {{ form.notificationtype }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">کانال ارسال</label>
                        {{ form.channel }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">مخاطبین (صنف)</label>
                    {{ form.target_class }}
                    <small class="text-muted">در صورت خالی گذاشتن، پیام برای تمام والدین ارسال می‌شود.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">متن پیام</label>
                    {{ form.message }}
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'notification_list' %}" class="btn btn-outline-secondary px-4">انصراف</a>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-paperplane me-1"></i> ارسال پیام</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
