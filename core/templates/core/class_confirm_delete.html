{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0">تأیید حذف صنف</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="fs-5 mb-4">آیا از حذف صنف <strong>{{ class_obj.class_name }}</strong> اطمینان دارید؟</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'class_list' %}" class="btn btn-light px-4">انصراف</a>
                            <button type="submit" class="btn btn-danger px-4">بله، حذف شود</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
