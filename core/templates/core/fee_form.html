{% extends 'core/base.html' %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

<div class="container py-4" style="max-width: 750px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-journal-plus me-2"></i>{{ title }}</h5>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                <!-- انتخاب شاگرد و صنف -->
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ form.enrollment.label }}</label>
                    {{ form.enrollment }}
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <label class="form-label fw-bold">{{ form.feetype.label }}</label>
                        {{ form.feetype }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">{{ form.fee_month.label }}</label>
                        {{ form.fee_month }}
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-5 mb-2 mb-md-0">
                        <label class="form-label fw-bold">{{ form.amount.label }}</label>
                        {{ form.amount }}
                    </div>
                    <div class="col-md-4 mb-2 mb-md-0">
                        <label class="form-label fw-bold">{{ form.discount_amount.label }}</label>
                        {{ form.discount_amount }}
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">{{ form.currency.label }}</label>
                        {{ form.currency }}
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <label class="form-label fw-bold">{{ form.due_date.label }}</label>
                        {{ form.due_date }}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">{{ form.description.label }}</label>
                    {{ form.description }}
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                    <a href="{% url 'fee_list' %}" class="btn btn-outline-secondary px-4">انصراف</a>
                    <button type="submit" class="btn btn-primary px-4">ذخیره فیس</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    $(document).ready(function() {
        $('.select2').select2({
            theme: 'bootstrap-5',
            dir: 'rtl',
            placeholder: "-- برای جستجو نام یا صنف شاگرد را تایپ کنید --",
            allowClear: true,
            width: '100%'
        });
    });
</script>
{% endblock %}
