{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h4 class="fw-bold mb-4 text-primary">{{ title }}</h4>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">{{ field.label }}</label>
                            {{ field }}
                        </div>
                        {% endfor %}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'teacher_list' %}" class="btn btn-light">انصراف</a>
                        <button type="submit" class="btn btn-primary px-4">ذخیره اطلاعات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
